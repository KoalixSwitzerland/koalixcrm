# =============================================================================
# docker-compose.yaml — KoalixCRM development environment
#
# AWS dependencies replaced with local services:
#   S3   -> MinIO      (port 9000 API, 9001 console)
#   SQS  -> ElasticMQ  (port 9324 API, 9325 UI)
#   OIDC -> Keycloak   (port 8180 on host, 8080 internal)
#   DB   -> PostgreSQL (port 5432)
#
# Usage:
#   docker compose up
#   docker compose down -v
# =============================================================================

services:

  # --- PostgreSQL (application database) ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: koalixcrm
      POSTGRES_USER: koalixcrm
      POSTGRES_PASSWORD: koalixcrm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - koalixcrm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koalixcrm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- MinIO (S3-compatible object storage) ---
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - koalixcrm-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- MinIO bucket setup (runs once, creates buckets, exits) ---
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/koalixcrm-pdf-exports &&
        echo 'Buckets created successfully.'
      "
    networks:
      - koalixcrm-net

  # --- ElasticMQ (SQS-compatible message broker) ---
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    networks:
      - koalixcrm-net

  # --- PostgreSQL for Keycloak ---
  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - koalixcrm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Keycloak (OIDC provider) ---
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - koalixcrm-net
    healthcheck:
      test: ["CMD-SHELL", "cat < /dev/null > /dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # --- Django backend ---
  web:
    image: ghcr.io/koalixswitzerland/koalixcrm-dev-container:main
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements/celery_requirements.txt &&
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
      - ./data:/usr/src/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      koalixcrm-net:
        aliases:
          - backend

  # --- Celery worker (PDF export microservice) ---
  celery:
    build:
      context: .
      dockerfile: Dockerfile-Celery
    env_file:
      - .env.local
    volumes:
      - .:/usr/src/app
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      elasticmq:
        condition: service_started
    networks:
      - koalixcrm-net

volumes:
  postgres_data:
  postgres_keycloak_data:
  minio_data:

networks:
  koalixcrm-net:
