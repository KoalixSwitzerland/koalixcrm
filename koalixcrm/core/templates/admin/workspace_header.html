{% load i18n %}
{% if active_workspace %}
<div id="workspace-header-band" style="
    background-color: {{ active_workspace_color|default:'#417690' }};
    color: #fff;
    padding: 4px 16px;
    font-size: 0.85em;
    display: flex;
    align-items: center;
    gap: 12px;
">
    <strong>{% trans "Workspace:" %} {{ active_workspace.name }}</strong>
    {% if user_workspaces|length > 1 %}
    <span>|</span>
    {% for ws in user_workspaces %}
        {% if ws != active_workspace %}
        <form method="post" action="/admin/core/workspace/switch/" style="display: inline;">
            {% csrf_token %}
            <input type="hidden" name="workspace_id" value="{{ ws.pk }}">
            <button type="submit" style="
                background: rgba(255,255,255,0.2);
                border: 1px solid rgba(255,255,255,0.5);
                border-radius: 3px;
                color: #fff;
                cursor: pointer;
                font-size: 0.9em;
                padding: 1px 8px;
            ">{{ ws.name }}</button>
        </form>
        {% endif %}
    {% endfor %}
    {% endif %}
</div>
{% endif %}
